query GetMediaBySort($page: Int, $sort: [MediaSort], $type: MediaType, $perPage: Int) {
  Page(page: $page, perPage: $perPage) {
    pageInfo { total lastPage }
    media(sort: $sort, type: $type) {
      id
      title {
        userPreferred
        romaji
        english
        native
      }
      coverImage {
        medium
        large
        extraLarge
      }
      bannerImage
      genres
      episodes
      chapters
      volumes
      type
      format
      averageScore: weightedScore
      seasonYear
    }
  }
}

query GetUpcomingMedia(
  $perPage: Int,
  $type: MediaType,
  $status: MediaStatus,
  $season: MediaSeason,
  $seasonYear: Int
) {
  Page(perPage: $perPage) {
    media(status: $status, type: $type, season: $season, seasonYear: $seasonYear, sort: [POPULARITY_DESC]) {
      id
        title {
        userPreferred
        romaji
        english
        native
      }
      coverImage {
        medium
        large
        extraLarge
      }
      episodes
      chapters
      volumes
      type
      format
      averageScore: weightedScore
      startDate { year month day }
      season
      seasonYear
    }
  }
}

query GetPaginatedMedia(
  $page: Int,
  $perPage: Int,
  $sort: [MediaSort],
  $type: MediaType,
  $status: MediaStatus,
  $statusIn: [MediaStatus],
  $format: MediaFormat,
  $season: MediaSeason,
  $seasonYear: Int
) {
  Page(page: $page, perPage: $perPage) {
    pageInfo {
      hasNextPage
      currentPage
      lastPage
      total
    }
    media(sort: $sort, type: $type, status: $status, status_in: $statusIn, format: $format, season: $season, seasonYear: $seasonYear) {
      id
      title {
        userPreferred
        romaji
        english
        native
      }
      coverImage {
        medium
        large
        extraLarge
      }
      episodes
      chapters
      volumes
      type
      format
      averageScore: weightedScore
      startDate { year month day }
      season
      seasonYear
    }
  }
}
