name: AniSync Stable ARM64 Release

on:
  push:
    branches:
      - feature/cloudstream-watch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AniSync Stable Release (ARM64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Stable Release
        run: |
          chmod +x gradlew
          ./gradlew assembleStableRelease --stacktrace
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: anisync-stable-release-arm64
          path: app/build/outputs/apk/stable/release/*-arm64-v8a-release.apk
          if-no-files-found: error
