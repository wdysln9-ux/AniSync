name: AniSync Stable ARM64 Debug

on:
  push:
    branches:
      - feature/cloudstream-watch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AniSync Stable Debug (ARM64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Stable Debug
        run: |
          chmod +x gradlew
          ./gradlew assembleStableDebug
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: anisync-stable-debug-arm64
          path: app/build/outputs/apk/stable/debug/*-arm64-v8a-debug.apk
          if-no-files-found: error
