name: AniSync Stable ARM64 Release (Latest Only)

on:
  push:
    branches:
      - main
      - feature/cloudstream-watch
      - feature/cloudstream-mpv-player
  workflow_dispatch:

concurrency:
  group: anisync-stable-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build AniSync Stable Release (ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Stable Release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 assembleStableRelease --stacktrace
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: anisync-stable-release-arm64
          path: app/build/outputs/apk/stable/release/*-arm64-v8a-release.apk
          if-no-files-found: error
