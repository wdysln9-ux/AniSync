name: CloudStream Watch Build

on:
  push:
    branches:
      - feature/cloudstream-watch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile AniSync with CloudStream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleStableDebug
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: anisync-cloudstream-debug
          path: app/build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error
