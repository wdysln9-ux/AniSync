name: Build Manual Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ARM64 Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Android NDK and CMake
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build ARM64 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleStableDebug
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v7
        with:
          name: AniSync-arm64-debug
          path: app/build/outputs/apk/stable/debug/*-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 30
          archive: false
