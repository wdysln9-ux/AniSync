name: Build Manual Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ARM64 Release APK (Manual)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure Android SDK paths
        run: |
          echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.13
      - name: Decode Keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: echo "$SIGNING_KEY" | base64 -d > ./app/release.keystore
      - name: Build ARM64 Release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleStableRelease
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v7
        with:
          name: AniSync-arm64-release
          path: app/build/outputs/apk/stable/release/*-arm64-v8a-release.apk
          if-no-files-found: error
          archive: false
